<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nora</title>
  <meta name="description" content="A parenting moment shared from Nora" />

  <!-- Open Graph meta tags for rich link previews. No og:description on
       purpose: the og:image is a rendered card that already shows the badge,
       title and body, so a description line under it in WhatsApp/etc. just
       repeats what's in the image. -->
  <meta property="og:title" content="Shared from Nora" />
  <meta property="og:type" content="article" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FFFFFF;
      color: #1E2939;
      -webkit-font-smoothing: antialiased;
    }

    /* Top nav */
    .topnav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #F3F4F6;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: block;
    }

    .wordmark {
      font-size: 16px;
      font-weight: 800;
      color: #1E2939;
      letter-spacing: -0.3px;
    }

    .open-app-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #8C49D5;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .open-app-btn:active { opacity: 0.85; }

    /* Page body */
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 20px 40px;
    }

    /* Loading & error */
    .loading, .error {
      text-align: center;
      padding: 80px 20px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #EDE4FA;
      border-top-color: #8C49D5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading p, .error p {
      font-size: 14px;
      color: #6B7280;
    }

    .error h2 {
      font-size: 18px;
      color: #1E2939;
      margin-bottom: 8px;
    }

    /* Card image (both layouts) */
    .card-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 12px;
      background: #F3F4F6;
      margin-bottom: 12px;
      display: block;
    }

    /* QUOTE layout — mirrors SubActionCard's QUOTE branch in HomeScreen_v2.tsx */
    .quote-card {
      background: #F7F3EC;
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
    }

    .quote-text {
      margin-top: 6px;
      color: #1E2939;
    }

    .quote-text.italic { font-style: italic; }
    .quote-text.bold { font-weight: 700; }

    .quote-divider {
      width: 40px;
      height: 2px;
      border-radius: 1px;
      background: #DDAEA5;
      margin: 16px auto 14px;
    }

    .quote-attribution {
      font-weight: 700;
      font-size: 15px;
      color: #1E2939;
    }

    /* CONTENT layout — mirrors HomeCardDetailScreen.tsx */
    .content-card { }

    .content-badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }

    .content-title {
      font-size: 22px;
      font-weight: 700;
      line-height: 28px;
      color: #1E2939;
      margin-bottom: 20px;
    }

    .content-body p {
      font-size: 15px;
      line-height: 24px;
      color: #1E2939;
      margin-bottom: 16px;
    }

    .content-body h3 {
      font-size: 17px;
      font-weight: 700;
      line-height: 26px;
      color: #1E2939;
      margin-bottom: 4px;
    }

    .content-body .bullet-row {
      display: flex;
      gap: 8px;
      padding-left: 4px;
      margin-bottom: 12px;
    }

    .content-body .bullet-dot {
      font-size: 15px;
      line-height: 24px;
      color: #1E2939;
    }

    .content-body .bullet-text {
      flex: 1;
      font-size: 15px;
      line-height: 24px;
      color: #1E2939;
    }

    .content-body img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 12px;
      background: #E5E6EA;
      margin-bottom: 16px;
      display: block;
    }

    .component-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #8C49D5;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 15px;
      font-weight: 600;
      color: #8C49D5;
      text-decoration: none;
    }

    /* Bottom CTA */
    .cta {
      margin-top: 32px;
      background: #FAF7FF;
      border: 1px solid #EDE4FA;
      border-radius: 24px;
      padding: 20px 20px 0;
    }

    .cta-hero-image {
      display: block;
      width: 90%;
      height: auto;
      margin: 0 auto;
      border-radius: 16px;
    }

    .cta-actions {
      padding: 20px;
    }

    .cta-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #8C49D5;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 15px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .cta-button:active { opacity: 0.9; }

    .cta-footnote {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 13px;
      color: #6B7280;
    }

    .cta-footnote-badge {
      width: 20px;
      height: 20px;
      border-radius: 10px;
      background: #EDE0FB;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

  </style>
</head>
<body>
  <div class="topnav">
    <div class="brand">
      <img class="brand-icon" src="/images/nora-icon.png" alt="" width="28" height="28" />
      <span class="wordmark">Nora AI - Parenting Coach</span>
    </div>
    <button class="open-app-btn" id="topnav-open-app">Open App</button>
  </div>

  <div class="page">
    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <p>Loading&hellip;</p>
    </div>

    <div id="error-container" class="error" style="display: none;">
      <h2>This card isn't available</h2>
      <p>It may have been removed, or the link is incorrect.</p>
    </div>

    <div id="card-container"></div>

    <div id="cta" class="cta" style="display: none;">
      <img class="cta-hero-image" src="/images/share-cta.jpg" alt="Want help putting this into practice? Learn simple play techniques with step-by-step coaching from Nora." />

      <div class="cta-actions">
        <button class="cta-button" id="cta-open-app">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>
          Download Nora
        </button>

        <div class="cta-footnote">
          <span class="cta-footnote-badge" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8C49D5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </span>
          Just 5 minutes a day
        </div>
      </div>
    </div>
  </div>

  <script>
    const APP_STORE_URL = 'https://apps.apple.com/sg/app/nora-parenting-coach/id6756343006';
    const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.chromamind.nora&hl=en';
    const STORE_URL = /android/i.test(navigator.userAgent) ? PLAY_STORE_URL : APP_STORE_URL;

    const params = new URLSearchParams(window.location.search);
    const cardId = params.get('card_id');

    const FONT_SIZE_MAP = { SMALL: 13, MEDIUM: 15, LARGE: 18 };

    function openApp() {
      if (!cardId) {
        window.location.href = STORE_URL;
        return;
      }
      const openedAt = Date.now();
      window.location.href = 'nora://card/' + encodeURIComponent(cardId);
      setTimeout(function () {
        if (Date.now() - openedAt < 2200 && !document.hidden) {
          window.location.href = STORE_URL;
        }
      }, 1500);
    }

    document.getElementById('topnav-open-app').addEventListener('click', openApp);
    document.getElementById('cta-open-app').addEventListener('click', openApp);

    if (!cardId) {
      showError();
    } else {
      loadCard(cardId);
    }

    async function loadCard(id) {
      try {
        const response = await fetch('/api/config/home-cards/share/' + encodeURIComponent(id));
        if (!response.ok) throw new Error('Card not found');
        const card = await response.json();
        displayCard(card);
      } catch (err) {
        console.error('Failed to load shared card:', err);
        showError();
      }
    }

    function displayCard(card) {
      document.title = card.cardType === 'QUOTE' ? 'A quote from Nora' : (card.detailTitle || 'Shared from Nora');
      const ogTitle = card.cardType === 'QUOTE' ? 'A quote shared from Nora' : (card.detailTitle || 'Shared from Nora');
      document.querySelector('meta[property="og:title"]').setAttribute('content', ogTitle);
      // No og:description — see the meta tags in <head>.

      const container = document.getElementById('card-container');
      container.innerHTML = card.cardType === 'QUOTE' ? renderQuoteCard(card) : renderContentCard(card);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('cta').style.display = 'block';
    }

    function renderQuoteCard(card) {
      const fontSize = FONT_SIZE_MAP[card.messageFontSize] || FONT_SIZE_MAP.MEDIUM;
      const lineHeight = Math.round(fontSize * 1.6);
      const classes = ['quote-text'];
      if (card.messageItalic) classes.push('italic');
      if (card.messageBold) classes.push('bold');

      let html = '<div class="quote-card">';
      if (card.imageUrl) {
        html += '<img class="card-image" src="' + escapeAttr(card.imageUrl) + '" alt="" />';
      }
      html += '<p class="' + classes.join(' ') + '" style="font-size:' + fontSize + 'px;line-height:' + lineHeight + 'px;">'
        + escapeHtml(card.message) + '</p>';
      if (card.attribution) {
        html += '<div class="quote-divider"></div><p class="quote-attribution">' + escapeHtml(card.attribution) + '</p>';
      }
      html += '</div>';
      return html;
    }

    function renderContentCard(card) {
      let html = '<div class="content-card">';
      if (card.imageUrl) {
        html += '<img class="card-image" src="' + escapeAttr(card.imageUrl) + '" alt="" />';
      }
      html += '<span class="content-badge" style="background-color:' + escapeAttr(card.badgeColor) + '">'
        + escapeHtml(card.badgeText) + '</span>';
      html += '<h1 class="content-title">' + escapeHtml(card.detailTitle || '') + '</h1>';
      html += '<div class="content-body">' + (card.components || []).map(renderComponent).join('') + '</div>';
      html += '</div>';
      return html;
    }

    // USER_INPUT is never included by the API here — no user session on
    // this public page, so there's nothing to render or save.
    function renderComponent(component) {
      if (component.type === 'TEXT') {
        return formatContent(component.text || '');
      }
      if (component.type === 'IMAGE') {
        return component.imageUrl ? '<img src="' + escapeAttr(component.imageUrl) + '" alt="" />' : '';
      }
      if (component.type === 'OPEN_DETAILS') {
        if (!component.linkedCardId) return '';
        return '<a class="component-cta" href="share-home-card.html?id=' + encodeURIComponent(component.linkedCardId) + '">'
          + escapeHtml(component.ctaLabel || 'Learn more') + ' &rarr;</a>';
      }
      return '';
    }

    // Lightweight port of formatLessonContentV2 (nora-mobile/src/utils/formatLessonContentV2.ts):
    // **bold**, *italic*, "* " bullets, "### " headings, "---" dividers,
    // ![](url) images, blank-line paragraph breaks. Kept in sync by hand since
    // this page has no build step to share the TS module directly.
    function formatContent(text) {
      const lines = text.replace(/\r\n/g, '\n').split('\n');
      let html = '';
      let paragraph = [];

      const flush = () => {
        if (paragraph.length === 0) return;
        html += '<p>' + formatInline(paragraph.join(' ')) + '</p>';
        paragraph = [];
      };

      for (const raw of lines) {
        const line = raw.trim();
        if (line === '') { flush(); continue; }
        const imageMatch = line.match(/^!\[\]\(([^)]+)\)$/);
        if (imageMatch) { flush(); html += '<img src="' + escapeAttr(imageMatch[1]) + '" alt="" />'; continue; }
        if (/^-{3,}$/.test(line)) { flush(); continue; }
        const headingMatch = line.match(/^#{1,6}\s+(.+)$/);
        if (headingMatch) { flush(); html += '<h3>' + formatInline(headingMatch[1]) + '</h3>'; continue; }
        if (line.startsWith('* ')) {
          flush();
          html += '<div class="bullet-row"><span class="bullet-dot">&bull;</span><span class="bullet-text">' + formatInline(line.slice(2)) + '</span></div>';
          continue;
        }
        paragraph.push(line);
      }
      flush();
      return html;
    }

    function formatInline(text) {
      let safe = escapeHtml(text);
      safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      safe = safe.replace(/\*(.+?)\*/g, '<em>$1</em>');
      return safe;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, '&quot;');
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-container').style.display = 'block';
    }
  </script>
</body>
</html>
