<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nora</title>
  <meta name="description" content="A parenting moment shared from Nora" />

  <!-- Open Graph meta tags for rich link previews -->
  <meta property="og:title" content="Shared from Nora" />
  <meta property="og:description" content="A parenting moment shared from Nora" />
  <meta property="og:type" content="article" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FFFFFF;
      color: #1E2939;
      -webkit-font-smoothing: antialiased;
    }

    /* Top nav */
    .topnav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #F3F4F6;
    }

    .wordmark {
      font-size: 20px;
      font-weight: 800;
      color: #8C49D5;
      letter-spacing: -0.3px;
    }

    .open-app-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #8C49D5;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .open-app-btn:active { opacity: 0.85; }

    /* Page body */
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 20px 40px;
    }

    /* Shared-by banner */
    .shared-by {
      display: none;
      align-items: center;
      gap: 12px;
      background: #F3EEFF;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 20px;
    }

    .shared-by.show { display: flex; }

    .shared-by-avatar {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background: #8C49D5;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shared-by-text {
      font-size: 14px;
      line-height: 20px;
      color: #1E2939;
    }

    .shared-by-name { font-weight: 700; }

    /* Loading & error */
    .loading, .error {
      text-align: center;
      padding: 80px 20px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #EDE4FA;
      border-top-color: #8C49D5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading p, .error p {
      font-size: 14px;
      color: #6B7280;
    }

    .error h2 {
      font-size: 18px;
      color: #1E2939;
      margin-bottom: 8px;
    }

    /* Card image (both layouts) */
    .card-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 12px;
      background: #F3F4F6;
      margin-bottom: 12px;
      display: block;
    }

    /* QUOTE layout — mirrors SubActionCard's QUOTE branch in HomeScreen_v2.tsx */
    .quote-card {
      background: #F7F3EC;
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
    }

    .quote-text {
      margin-top: 6px;
      color: #1E2939;
    }

    .quote-text.italic { font-style: italic; }
    .quote-text.bold { font-weight: 700; }

    .quote-divider {
      width: 40px;
      height: 2px;
      border-radius: 1px;
      background: #DDAEA5;
      margin: 16px auto 14px;
    }

    .quote-attribution {
      font-weight: 700;
      font-size: 15px;
      color: #1E2939;
    }

    /* CONTENT layout — mirrors HomeCardDetailScreen.tsx */
    .content-card { }

    .content-badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }

    .content-title {
      font-size: 22px;
      font-weight: 700;
      line-height: 28px;
      color: #1E2939;
      margin-bottom: 20px;
    }

    .content-body p {
      font-size: 15px;
      line-height: 24px;
      color: #1E2939;
      margin-bottom: 16px;
    }

    .content-body h3 {
      font-size: 17px;
      font-weight: 700;
      line-height: 26px;
      color: #1E2939;
      margin-bottom: 4px;
    }

    .content-body .bullet-row {
      display: flex;
      gap: 8px;
      padding-left: 4px;
      margin-bottom: 12px;
    }

    .content-body .bullet-dot {
      font-size: 15px;
      line-height: 24px;
      color: #1E2939;
    }

    .content-body .bullet-text {
      flex: 1;
      font-size: 15px;
      line-height: 24px;
      color: #1E2939;
    }

    .content-body img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 12px;
      background: #E5E6EA;
      margin-bottom: 16px;
      display: block;
    }

    /* Bottom CTA */
    .cta {
      margin-top: 32px;
      background: #FAF7FF;
      border: 1px solid #EDE4FA;
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
    }

    .cta h3 {
      font-size: 17px;
      font-weight: 700;
      color: #1E2939;
      margin-bottom: 6px;
    }

    .cta p {
      font-size: 14px;
      line-height: 20px;
      color: #6B7280;
      margin-bottom: 18px;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #8C49D5;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 15px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .cta-button:active { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="topnav">
    <span class="wordmark">Nora</span>
    <button class="open-app-btn" onclick="openApp()">Open App</button>
  </div>

  <div class="page">
    <div class="shared-by" id="shared-by">
      <div class="shared-by-avatar" id="shared-by-avatar"></div>
      <div class="shared-by-text">
        <span class="shared-by-name" id="shared-by-name"></span> shared this with you from Nora
      </div>
    </div>

    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <p>Loading&hellip;</p>
    </div>

    <div id="error-container" class="error" style="display: none;">
      <h2>This card isn't available</h2>
      <p>It may have been removed, or the link is incorrect.</p>
    </div>

    <div id="card-container"></div>

    <div id="cta" class="cta" style="display: none;">
      <h3>Get the full Nora experience</h3>
      <p>Guided play, real-time coaching, and daily support for your parenting journey — just 5 minutes a day.</p>
      <button class="cta-button" onclick="openApp()">Download Nora</button>
    </div>
  </div>

  <script>
    const APP_STORE_URL = 'https://apps.apple.com/sg/app/nora-parenting-coach/id6756343006';

    const params = new URLSearchParams(window.location.search);
    const cardId = params.get('card_id');
    const sharedBy = params.get('shared_by');

    const FONT_SIZE_MAP = { SMALL: 13, MEDIUM: 15, LARGE: 18 };

    function openApp() {
      if (!cardId) {
        window.location.href = APP_STORE_URL;
        return;
      }
      const openedAt = Date.now();
      window.location.href = 'nora://card/' + encodeURIComponent(cardId);
      setTimeout(function () {
        if (Date.now() - openedAt < 2200 && !document.hidden) {
          window.location.href = APP_STORE_URL;
        }
      }, 1500);
    }

    if (sharedBy) {
      document.getElementById('shared-by-name').textContent = sharedBy;
      document.getElementById('shared-by-avatar').textContent = sharedBy.trim().charAt(0).toUpperCase();
      document.getElementById('shared-by').classList.add('show');
    }

    if (!cardId) {
      showError();
    } else {
      loadCard(cardId);
    }

    async function loadCard(id) {
      try {
        const response = await fetch('/api/config/home-cards/share/' + encodeURIComponent(id));
        if (!response.ok) throw new Error('Card not found');
        const card = await response.json();
        displayCard(card);
      } catch (err) {
        console.error('Failed to load shared card:', err);
        showError();
      }
    }

    function displayCard(card) {
      document.title = card.cardType === 'QUOTE' ? 'A quote from Nora' : (card.detailTitle || 'Shared from Nora');
      const ogTitle = card.cardType === 'QUOTE' ? 'A quote shared from Nora' : (card.detailTitle || 'Shared from Nora');
      const ogDesc = card.cardType === 'QUOTE' ? card.message : (card.detailTitle || '');
      document.querySelector('meta[property="og:title"]').setAttribute('content', ogTitle);
      document.querySelector('meta[property="og:description"]').setAttribute('content', ogDesc);

      const container = document.getElementById('card-container');
      container.innerHTML = card.cardType === 'QUOTE' ? renderQuoteCard(card) : renderContentCard(card);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('cta').style.display = 'block';
    }

    function renderQuoteCard(card) {
      const fontSize = FONT_SIZE_MAP[card.messageFontSize] || FONT_SIZE_MAP.MEDIUM;
      const lineHeight = Math.round(fontSize * 1.6);
      const classes = ['quote-text'];
      if (card.messageItalic) classes.push('italic');
      if (card.messageBold) classes.push('bold');

      let html = '<div class="quote-card">';
      if (card.imageUrl) {
        html += '<img class="card-image" src="' + escapeAttr(card.imageUrl) + '" alt="" />';
      }
      html += '<p class="' + classes.join(' ') + '" style="font-size:' + fontSize + 'px;line-height:' + lineHeight + 'px;">'
        + escapeHtml(card.message) + '</p>';
      if (card.attribution) {
        html += '<div class="quote-divider"></div><p class="quote-attribution">' + escapeHtml(card.attribution) + '</p>';
      }
      html += '</div>';
      return html;
    }

    function renderContentCard(card) {
      let html = '<div class="content-card">';
      if (card.imageUrl) {
        html += '<img class="card-image" src="' + escapeAttr(card.imageUrl) + '" alt="" />';
      }
      html += '<span class="content-badge" style="background-color:' + escapeAttr(card.badgeColor) + '">'
        + escapeHtml(card.badgeText) + '</span>';
      html += '<h1 class="content-title">' + escapeHtml(card.detailTitle || '') + '</h1>';
      html += '<div class="content-body">' + formatContent(card.detailContent || '') + '</div>';
      html += '</div>';
      return html;
    }

    // Lightweight port of formatLessonContentV2 (nora-mobile/src/utils/formatLessonContentV2.ts):
    // **bold**, *italic*, "* " bullets, "### " headings, "---" dividers,
    // ![](url) images, blank-line paragraph breaks. Kept in sync by hand since
    // this page has no build step to share the TS module directly.
    function formatContent(text) {
      const lines = text.replace(/\r\n/g, '\n').split('\n');
      let html = '';
      let paragraph = [];

      const flush = () => {
        if (paragraph.length === 0) return;
        html += '<p>' + formatInline(paragraph.join(' ')) + '</p>';
        paragraph = [];
      };

      for (const raw of lines) {
        const line = raw.trim();
        if (line === '') { flush(); continue; }
        const imageMatch = line.match(/^!\[\]\(([^)]+)\)$/);
        if (imageMatch) { flush(); html += '<img src="' + escapeAttr(imageMatch[1]) + '" alt="" />'; continue; }
        if (/^-{3,}$/.test(line)) { flush(); continue; }
        const headingMatch = line.match(/^#{1,6}\s+(.+)$/);
        if (headingMatch) { flush(); html += '<h3>' + formatInline(headingMatch[1]) + '</h3>'; continue; }
        if (line.startsWith('* ')) {
          flush();
          html += '<div class="bullet-row"><span class="bullet-dot">&bull;</span><span class="bullet-text">' + formatInline(line.slice(2)) + '</span></div>';
          continue;
        }
        paragraph.push(line);
      }
      flush();
      return html;
    }

    function formatInline(text) {
      let safe = escapeHtml(text);
      safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      safe = safe.replace(/\*(.+?)\*/g, '<em>$1</em>');
      return safe;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, '&quot;');
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-container').style.display = 'block';
    }
  </script>
</body>
</html>
